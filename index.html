<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mykeros</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --ink: #211f33;
    --ink-soft: #58547a;
    --ink-faint: #8b87a8;
    --ground: #f4f0e6;
    --card: #fffdf8;
    --card-2: #ece5d4;
    --line: #ddd4bd;
    --accent: #6f5fb8;
    --accent-soft: #ebe6f7;
    --amber: #c97f3a;
    --amber-soft: #f6e6d3;
    --rose: #b8636f;
    --rose-soft: #f4e0e2;
    --danger: #b8636f;
    --shadow: 220 20% 15%;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f0ece0; --ink-soft: #c3bdd9; --ink-faint: #8a84a6;
      --ground: #16142a; --card: #211f38; --card-2: #2a2745; --line: #3a3660;
      --accent: #a596e6; --accent-soft: #322c56;
      --amber: #e2a869; --amber-soft: #3a2f26;
      --rose: #dd97a1; --rose-soft: #3a2530;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
  }
  h1, h2, h3, .display { font-family: 'Fraunces', Georgia, serif; font-weight: 500; text-wrap: balance; letter-spacing: -0.01em; margin: 0; }

  .frame {
    width: 100%;
    max-width: 440px;
    height: min(820px, 100dvh);
    background: var(--card);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  #app-root {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }
  @media (min-width: 480px) {
    body { padding-block: 32px; }
    .frame { border: 1px solid var(--line); border-radius: 34px; overflow: hidden; box-shadow: 0 30px 60px -20px hsl(var(--shadow) / 0.35), 0 2px 8px hsl(var(--shadow) / 0.15); }
  }

  .statusbar {
    padding: 18px 22px 6px;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-faint);
    position: relative; z-index: 1;
  }
  .brand { display: flex; align-items: center; gap: 6px; font-family: 'Fraunces', Georgia, serif; font-size: 14px; font-weight: 500; letter-spacing: -0.01em; }
  .glyph-icon { display: inline-flex; flex-shrink: 0; }

  .view { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 4px 22px 26px; position: relative; z-index: 1; }
  .view.center { justify-content: center; align-items: center; text-align: center; }

  /* Auth */
  .auth-view { position: relative; justify-content: flex-start; align-items: center; text-align: center; padding-top: 57px; padding-bottom: 46px; }
  .auth-box { width: 100%; max-width: 320px; margin: 0 auto; display: flex; flex-direction: column; gap: 0; }
  .auth-box h1 { font-size: 26px; }
  .auth-image { width: 108px; margin: 0 auto; }
  .auth-image img { width: 100%; height: auto; display: block; }
  #auth-form { margin-top: 44px; }
  #auth-toggle { margin-top: 6px; }
  .view.rest-view { padding-top: 57px; padding-bottom: 46px; }
  .view.rest-view .rest-header { margin-top: 20px; }
  .view.rest-view .step-title { margin-top: 20px; }
  .view.rest-view .journal-title { margin-top: 20px; text-align: center; }
  .view.rest-view .progress-row { justify-content: center; padding: 16px 0 0; }
  .view.rest-view .loading-block { flex: 1; justify-content: flex-start; padding-top: 36px; }
  .field { display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .field label { font-size: 11px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); }
  .field input, .field textarea, .field select {
    border: 1px solid var(--line); border-radius: 10px; background: var(--card);
    color: var(--ink); padding: 11px 12px; font-family: 'Work Sans', sans-serif; font-size: 14px;
  }
  .btn {
    border: none; border-radius: 999px; padding: 12px 18px; font-weight: 600; font-size: 14px;
    cursor: pointer; font-family: 'Work Sans', sans-serif; transition: opacity .15s;
  }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-primary { background: var(--accent); color: var(--card); }
  .btn-ghost { background: none; border: 1px solid var(--line); color: var(--ink-soft); }
  .btn-block { width: 100%; }
  .link-btn { background: none; border: none; color: var(--accent); font-size: 13px; cursor: pointer; font-family: 'Work Sans', sans-serif; }
  .msg { font-size: 12.5px; padding: 10px 12px; border-radius: 10px; text-align: left; }
  .msg.error { background: var(--rose-soft); color: var(--rose); }
  .msg.ok { background: var(--accent-soft); color: var(--accent); }

  /* Nav */
  .topnav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px 22px 0; position: relative; z-index: 1; }
  .topnav .journal-link { justify-self: start; }
  .topnav .logout-link { justify-self: end; }
  .topnav .brand { justify-self: center; }
  .topnav .journal-link, .topnav .logout-link {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-soft); background: none; border: none; cursor: pointer; padding: 4px;
  }

  /* Recueil */
  .recueil { justify-content: flex-start; align-items: center; text-align: center; padding-top: 8px; padding-bottom: 46px; }
  .recueil .mic-content { margin-top: 45px; width: 100%; display: flex; flex-direction: column; align-items: center; }
  .recueil .mic-wrap { margin-top: 22px; width: 116px; height: 116px; }
  .recueil .mic-bottom { margin-top: 0; width: 100%; }
  .recueil-image { width: 111px; margin: 0 auto; }
  .recueil-image img { width: 100%; height: auto; display: block; }
  .greet { color: var(--ink-faint); font-size: 13px; margin-bottom: 2px; }
  .prompt { font-size: 21px; max-width: 280px; margin: 0 auto; }
  .mic-wrap { position: relative; width: 148px; height: 148px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .mic-ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid var(--accent); opacity: 0.35; }
  .mic-ring.pulse { animation: pulse 2.6s ease-out infinite; }
  .mic-ring.d2 { animation-delay: .9s; } .mic-ring.d3 { animation-delay: 1.8s; }
  @keyframes pulse { 0% { transform: scale(0.7); opacity: 0.5; } 100% { transform: scale(1.45); opacity: 0; } }
  .mic-btn { position: relative; z-index: 1; width: 92px; height: 92px; border-radius: 50%; background: var(--accent); border: none; color: var(--card); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 12px 24px -8px hsl(var(--shadow) / 0.4); }
  .recueil .mic-btn { width: 60px; height: 60px; }
  .mic-btn.recording { background: var(--rose); }
  .mic-hint { font-size: 12px; color: var(--ink-faint); max-width: 240px; line-height: 1.5; margin: 0 auto; }
  .recueil .mic-hint { margin-top: 26px; }
  .text-toggle { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  .recit-preview { width: 100%; text-align: left; background: var(--card-2); border-radius: 12px; padding: 12px; font-size: 13.5px; line-height: 1.5; max-height: 160px; overflow-y: auto; margin-top: 14px; }
  .recit-textarea { width: 100%; min-height: 140px; margin-top: 14px; text-align: left; }


  /* Step card (sentiment/nom/contexte/associations) */
  .step-title { font-size: 22px; margin-bottom: 18px; text-align: center; }
  .step-card { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 16px; padding: 16px; margin-top: 8px; }
  .step-card .k-label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
  .step-card .k-word { font-family: 'Fraunces', serif; font-size: 19px; margin: 4px 0 12px; }
  .step-card .a-label { font-size: 11px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
  .chip { font-family: 'Work Sans', sans-serif; font-size: 13px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; transition: opacity .15s; }
  .chip.selected { background: var(--accent); border-color: var(--accent); color: var(--card); }
  .chip:disabled { opacity: 0.35; cursor: default; }
  .chip-pairs { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 16px; }
  .chip-pair-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .chip-pair-row .chip { width: 100%; }
  .chip-pair-sep { color: var(--ink-faint); font-size: 12px; }
  .kw-input { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); padding: 10px 12px; font-family: 'Work Sans', sans-serif; font-size: 13.5px; min-height: 64px; resize: none; line-height: 1.4; }
  .kw-meta { display: flex; justify-content: space-between; margin-top: 8px; font-size: 10.5px; color: var(--ink-faint); font-family: 'IBM Plex Mono', monospace; }
  .kw-next { margin-top: 12px; width: 100%; padding: 11px; border: none; border-radius: 10px; background: var(--ink); color: var(--card); font-weight: 600; font-size: 13px; cursor: pointer; }
  .kw-next:disabled { opacity: 0.4; }

  .progress-row { display: flex; align-items: center; justify-content: flex-end; padding: 6px 0 14px; }
  .progress-dots { display: flex; gap: 5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
  .dot.done { background: var(--accent); } .dot.now { background: var(--amber); }
  .kw-history { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .kw-row { display: grid; grid-template-columns: 108px 1fr; gap: 10px; padding: 10px 12px; background: var(--card-2); border-radius: 12px; font-size: 12.5px; opacity: 0.72; }
  .kw-row .k { font-weight: 600; color: var(--ink); } .kw-row .a { color: var(--ink-soft); }

  .kw-bg { position: absolute; left: 50%; top: 380px; width: 170px; height: 170px; transform: translate(-50%, -50%); pointer-events: none; z-index: 0; }
  .kw-bg svg { width: 100%; height: 100%; opacity: 0.05; }
  :root:not([data-theme="light"]) .kw-bg svg, :root[data-theme="dark"] .kw-bg svg { opacity: 0.08; }

  /* Restitution */
  .rest-header { padding-top: 6px; margin-bottom: 4px; text-align: center; }
  .rest-tag { display: inline-flex; gap: 6px; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--rose); background: var(--rose-soft); padding: 4px 10px; border-radius: 999px; margin-bottom: 18px; }
  .rest-title { font-size: 25px; margin-bottom: 10px; }
  .rest-block { margin-bottom: 18px; }
  .rest-block h3 { font-size: 11px; font-family: 'Work Sans', sans-serif; font-weight: 700; margin: 0 0 6px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; }
  .rest-block p { font-size: 14px; line-height: 1.6; margin: 0; color: var(--ink); }
  .motif-card { background: var(--amber-soft); border: 1px solid var(--amber); border-radius: 14px; padding: 14px; display: flex; gap: 12px; align-items: flex-start; margin-bottom: 18px; }
  .motif-card .t { font-size: 12.5px; line-height: 1.5; color: var(--ink); }
  .premium-cta { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .premium-cta .txt { font-size: 12px; color: var(--ink-soft); max-width: 190px; line-height: 1.4; }
  .loading-block { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; flex: 1; text-align: center; color: var(--ink-soft); font-size: 13.5px; }
  .spinner { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Journal */
  .journal-title { font-size: 22px; margin-bottom: 16px; }
  .journal-list { display: flex; flex-direction: column; gap: 10px; }
  .journal-row { display: flex; align-items: center; gap: 12px; background: var(--card-2); border-radius: 12px; padding: 12px 14px; cursor: pointer; text-align: left; border: none; width: 100%; font-family: inherit; color: var(--ink); }
  .journal-row .num { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-faint); flex-shrink: 0; width: 32px; }
  .journal-row .meta { flex: 1; min-width: 0; }
  .journal-row .name { font-family: 'Fraunces', serif; font-size: 15px; }
  .journal-row .date { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
  .journal-empty { color: var(--ink-faint); font-size: 13.5px; text-align: center; margin-top: 40px; }
  .fab { position: fixed; bottom: 24px; right: 24px; z-index: 5; }

  .footer-actions { display: flex; gap: 10px; margin-top: 16px; }
  .check-row { display: flex; gap: 10px; align-items: flex-start; text-align: left; font-size: 11.5px; line-height: 1.45; color: var(--ink-soft); margin: 4px 0 2px; }
  .check-row input { margin-top: 2px; flex: none; width: 16px; height: 16px; accent-color: var(--accent); }
  .check-row a, .legal-links a, .legal-body a { color: var(--accent); text-decoration: underline; cursor: pointer; }
  .legal-links { display: flex; gap: 6px 12px; flex-wrap: wrap; justify-content: center; font-size: 11.5px; margin-top: 14px; color: var(--ink-faint); }
  .legal-body { text-align: left; font-size: 13px; line-height: 1.6; color: var(--ink); }
  .legal-body h3 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); margin: 18px 0 6px; }
  .legal-body p, .legal-body ul { margin: 0 0 8px; padding: 0; }
  .legal-body ul { padding-left: 18px; }
  .legal-body .todo { background: var(--rose-soft); color: var(--rose); border-radius: 4px; padding: 0 4px; }
  .legal-body .stamp { font-size: 11.5px; color: var(--ink-faint); }
  .danger-link { background: none; border: none; color: var(--danger); font-size: 12.5px; cursor: pointer; font-family: 'Work Sans', sans-serif; text-decoration: underline; padding: 6px; }
  .account-section { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
  .account-section .row { display: flex; flex-direction: column; gap: 6px; }
  .account-section .mail { font-size: 13px; color: var(--ink-soft); }

  .footer-glyph { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; color: var(--accent); opacity: 0.55; pointer-events: none; z-index: 2; }
  .footer-actions .btn { flex: 1; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div id="app-root"></div>
  <div class="footer-glyph" id="footer-glyph"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://lyeoanwpxjbuhnwoceeb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5ZW9hbndweGpidWhud29jZWViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwODgzMDcsImV4cCI6MjEwNTY2NDMwN30.D4mVV081nDWRx-By0y7HjQsY5UpSSkwz0nzzw9uTnQU";
// Capturé AVANT que supabase-js n'efface le hash de l'URL (lien « mot de passe oublié »)
const RECOVERY_AT_LOAD = /(^|[#&?])type=recovery/.test(location.hash + location.search);
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { flowType: 'implicit' } });

const GLYPH = (size, opacity) => `<svg class="glyph-icon" width="${size}" height="${size}" viewBox="0 0 100 100" fill="none" style="opacity:${opacity ?? 1}"><path d="M 42 14 L 42 58 L 20 58" stroke="currentColor" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" fill="none"/><path d="M 58 14 L 58 58 L 80 58" stroke="currentColor" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" fill="none"/></svg>`;

let state = {
  session: null,
  profile: null,
  view: 'loading',
  authMode: 'signin',
  reve: null,       // in-progress reve row
  recit: '',
  keywords: [],     // [{texte, categorie, association}]
  kwIndex: 0,
  journal: [],
  authDraft: {},
  recovery: false,
  legalDoc: 'confidentialite',
  legalBack: 'auth',
};

const root = document.getElementById('app-root');
function h(html) { root.innerHTML = html; }
function $(sel) { return root.querySelector(sel); }

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDate(d) {
  const dt = new Date(d);
  return dt.toLocaleDateString('fr-CH', { day: '2-digit', month: 'short', year: 'numeric' });
}

// ---------- AUTH ----------
async function init() {
  if (RECOVERY_AT_LOAD) state.recovery = true;
  sb.auth.onAuthStateChange((_event, session) => {
    state.session = session;
    if (_event === 'PASSWORD_RECOVERY') { state.recovery = true; state.view = 'reset'; render(); return; }
    if (session) { loadProfileAndGo(); } else { state.view = 'auth'; render(); }
  });
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  if (state.session) { await loadProfileAndGo(); } else { state.view = 'auth'; render(); }
}

async function loadProfileAndGo() {
  if (state.recovery) { state.view = 'reset'; render(); return; }
  const uid = state.session.user.id;
  let { data: profile } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
  if (!profile) {
    // trigger may not have fired yet (rare race) — retry once shortly
    await new Promise(r => setTimeout(r, 800));
    ({ data: profile } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle());
  }
  state.profile = profile;
  state.view = 'recueil';
  render();
}

const CONSENT_VERSION = '2026-10-07';
function openLegal(doc, back) {
  if (state.view === 'auth') {
    state.authDraft = { prenom: $('#auth-prenom')?.value || '', genre: $('#auth-genre')?.value || '', email: $('#auth-email')?.value || '' };
  }
  state.legalDoc = doc; state.legalBack = back; state.view = 'legal'; render();
}
function legalLinksHtml() {
  return `<div class="legal-links"><a data-legal="confidentialite">Confidentialité</a><a data-legal="cgu">CGU</a></div>`;
}
function bindLegalLinks(back) {
  root.querySelectorAll('[data-legal]').forEach(a => { a.onclick = (e) => { e.preventDefault(); openLegal(a.dataset.legal, back); }; });
}

function renderAuth() {
  const mode = state.authMode;
  const isSignup = mode === 'signup';
  const isForgot = mode === 'forgot';
  const d = state.authDraft || {};
  h(`
    ${topNav(false, false)}
    <div class="view auth-view">
      <div class="auth-box">
        <div class="auth-image"><img src="mykeros-figure-cutout.png" alt=""></div>
        <div id="auth-msg"></div>
        <form id="auth-form" class="auth-box" style="gap:9px;">
          ${isSignup ? `<div class="field"><label>Prénom</label><input type="text" id="auth-prenom" required autocomplete="given-name" value="${escapeHtml(d.prenom || '')}"></div>` : ''}
          ${isSignup ? `<div class="field"><label>Genre <span style="opacity:.6">(optionnel)</span></label><select id="auth-genre"><option value="">Je préfère ne pas dire</option><option value="femme"${d.genre === 'femme' ? ' selected' : ''}>Femme</option><option value="homme"${d.genre === 'homme' ? ' selected' : ''}>Homme</option><option value="autre"${d.genre === 'autre' ? ' selected' : ''}>Autre</option></select></div>` : ''}
          <div class="field"><label>Email</label><input type="email" id="auth-email" required autocomplete="email" value="${escapeHtml(d.email || '')}"></div>
          ${isForgot ? '' : `<div class="field"><label>Mot de passe</label><input type="password" id="auth-password" required minlength="6" autocomplete="${isSignup ? 'new-password' : 'current-password'}"></div>`}
          ${isSignup ? `<label class="check-row"><input type="checkbox" id="auth-consent" required><span>J'ai 15 ans ou plus. J'accepte les <a data-legal="cgu">CGU</a> et la <a data-legal="confidentialite">politique de confidentialité</a>, et je consens expressément au traitement de mes récits de rêves, qui peuvent révéler des données sensibles.</span></label>` : ''}
          <button type="submit" class="btn btn-primary btn-block" id="auth-submit">${isSignup ? "S'inscrire" : isForgot ? 'Envoyer le lien' : 'Se connecter'}</button>
        </form>
        <button class="link-btn" id="auth-toggle">${isSignup ? 'Déjà un compte ? Se connecter' : isForgot ? 'Retour à la connexion' : "Pas de compte ? S'inscrire"}</button>
        ${mode === 'signin' ? `<button class="link-btn" id="auth-forgot" style="margin-top:2px">Mot de passe oublié ?</button>` : ''}
        ${legalLinksHtml()}
      </div>
    </div>
  `);
  bindTopNav();
  bindLegalLinks('auth');
  $('#auth-toggle').onclick = () => { state.authMode = (isSignup || isForgot) ? 'signin' : 'signup'; renderAuth(); };

let recognition = null;
let recognizing = false;

function renderRecueil() {
  if (recognition && recognizing) {
    try { recognition.onend = null; recognition.stop(); } catch (e) {}
  }
  recognizing = false;
  const prenom = state.session?.user?.user_metadata?.prenom;
  const first = prenom || (state.profile?.email || '').split('@')[0];
  h(`
    ${topNav(true)}
    <div class="view recueil">
      <div class="recueil-image"><img src="mykeros-figure-cutout.png" alt=""></div>
      <div class="mic-content">
        <div>
          <div class="greet">${escapeHtml(first)}</div>
          <div class="prompt display">Racontez votre rêve,<br>là, tout de suite.</div>
        </div>
        <div class="mic-wrap">
          <div class="mic-ring" id="ring1"></div>
          <div class="mic-ring d2" id="ring2"></div>
          <div class="mic-ring d3" id="ring3"></div>
          <button class="mic-btn" id="mic-btn" aria-label="Démarrer l'enregistrement">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
        </div>
        <div id="recit-area"></div>
        <div class="mic-bottom">
          <p class="mic-hint" id="mic-hint">Parlez comme si vous y étiez encore. On transcrit pendant que le rêve est frais.</p>
          <button class="text-toggle" id="text-toggle" style="margin-top:14px;">Écrire plutôt</button>
          <div class="footer-actions" id="recueil-actions" style="display:none;">
            <button class="btn btn-primary btn-block" id="recueil-continue">Continuer →</button>
          </div>
        </div>
      </div>
    </div>
  `);
  bindTopNav();

  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recitArea = $('#recit-area');
  const actions = $('#recueil-actions');
  const micHint = $('#mic-hint');
  const defaultHint = 'Parlez comme si vous y étiez encore. On transcrit pendant que le rêve est frais.';

  function showTextArea(prefill) {
    recitArea.innerHTML = `<textarea class="kw-input recit-textarea" id="recit-text" placeholder="Racontez ce dont vous vous souvenez…">${escapeHtml(prefill || '')}</textarea>`;
    $('#recit-text').addEventListener('input', updateContinueState);
    updateContinueState();
  }
  function updateContinueState() {
    const el = $('#recit-text');
    const val = el ? el.value.trim() : '';
    actions.style.display = val ? 'flex' : 'none';
    state.recit = val;
  }

  $('#text-toggle').onclick = () => {
    showTextArea(state.recit);
    $('#recit-text').focus();
  };

  $('#mic-btn').onclick = () => {
    if (!SpeechRec) {
      micHint.textContent = "La dictée vocale n'est pas disponible sur ce navigateur — utilisez « Écrire plutôt ».";
      return;
    }
    if (recognizing) {
      recognition.stop();
      return;
    }
    recognition = new SpeechRec();
    recognition.lang = 'fr-FR';
    recognition.continuous = true;
    recognition.interimResults = true;
    let finalTranscript = state.recit || '';
    showTextArea(finalTranscript);
    recognition.onstart = () => {
      recognizing = true;
      $('#mic-btn').classList.add('recording');
      micHint.textContent = 'Je vous écoute…';
    };
    recognition.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalTranscript += t + ' ';
        else interim += t;
      }
      const el = $('#recit-text');
      if (el) { el.value = (finalTranscript + interim).trim(); updateContinueState(); el.scrollTop = el.scrollHeight; }
    };
    recognition.onerror = (e) => {
      const messages = {
        'not-allowed': "Micro bloqué. Cliquez sur l'icône de cadenas/site dans la barre d'adresse Chrome → Autorisations du site → Microphone → Autoriser, puis rechargez la page. Vérifiez aussi Réglages système macOS → Confidentialité et sécurité → Microphone → Chrome activé.",
        'service-not-allowed': "Le service de dictée n'est pas disponible dans ce contexte.",
        'no-speech': "Rien entendu — réessayez.",
        'network': "Problème réseau pendant la dictée — réessayez.",
        'audio-capture': "Aucun micro détecté sur cet appareil.",
      };
      micHint.textContent = messages[e.error] || `Problème de dictée (${e.error}) — vous pouvez écrire directement.`;
    };
    recognition.onend = () => {
      recognizing = false;
      $('#mic-btn').classList.remove('recording');
      micHint.textContent = defaultHint;
    };
    recognition.start();
  };

  $('#recueil-continue').onclick = async () => {
    if (!state.recit) return;
    const btn = $('#recueil-continue');
    btn.disabled = true; btn.textContent = 'Un instant…';
    try {
      const { data: reve, error } = await sb.from('reves').insert({
        user_id: state.session.user.id,
        transcription: state.recit,
      }).select().single();
      if (error) throw error;
      state.reve = reve;
      state.keywords = [];
      state.kwIndex = 0;
      state.view = 'sentiment';
      render();
    } catch (err) {
      alert("Erreur à l'enregistrement du rêve : " + (err.message || err));
      btn.disabled = false; btn.textContent = 'Continuer →';
    }
  };
}

const SENTIMENT_PAIRS = [
  ['Joie', 'Tristesse'],

];

function renderSentiment() {
  const selected = [];
  h(`
    ${topNav(true)}
    <div class="view rest-view">
      <div class="auth-image"><img src="mykeros-figure-cutout.png" alt=""></div>

        <div class="chip-pairs" id="sentiment-chips">
          ${SENTIMENT_PAIRS.map(([a, b]) => `
            <div class="chip-pair-row">
              <button type="button" class="chip" data-val="${escapeHtml(a)}">${escapeHtml(a)}</button>
              <span class="chip-pair-sep">↔</span>
              <button type="button" class="chip" data-val="${escapeHtml(b)}">${escapeHtml(b)}</button>
            </div>
          `).join('')}
        </div>
        <button class="kw-next" id="sentiment-next">Continuer →</button>
      </div>
    </div>
  `);
  bindTopNav();
  const btn = $('#sentiment-next');
  btn.disabled = true;
  $('#sentiment-chips').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const val = chip.dataset.val;
    const idx = selected.indexOf(val);
    if (idx > -1) {
      selected.splice(idx, 1);
      chip.classList.remove('selected');
    } else {
      if (selected.length >= 2) return;
      selected.push(val);
      chip.classList.add('selected');
    }
    $('#sentiment-chips').querySelectorAll('.chip').forEach(c => {
      if (!selected.includes(c.dataset.val)) c.disabled = selected.length >= 2;
    });
    btn.disabled = selected.length === 0;
  });
  btn.onclick = async () => {
    btn.disabled = true;
    const { data, error } = await sb.from('reves').update({ sentiment: selected.join(', ') }).eq('id', state.reve.id).select().single();
    if (!error) state.reve = data;
    state.view = 'nom';
    render();
  };
}

async function startAssociations() {
  state.view = 'extracting';
  render();
  try {
    const { data, error } = await sb.functions.invoke('extract-keywords', {
      body: { recit: state.reve.transcription },
    });
    if (error) throw error;
    const mots = (data && data.mots_cles) || [];
    state.keywords = mots.map(m => ({ texte: m.texte, categorie: m.categorie, association: '' }));
    if (state.keywords.length === 0) {
      state.keywords = [{ texte: 'Un élément marquant', categorie: 'action', association: '' }];
    }
    state.kwIndex = 0;
    state.view = 'associations';
    render();
  } catch (err) {
    state.view = 'extract-error';
    render();
  }
}

function renderAssociations() {
  const total = state.keywords.length;
  const idx = state.kwIndex;
  const current = state.keywords[idx];
  const history = state.keywords.slice(0, idx);
  const dots = state.keywords.map((_, i) => `<span class="dot ${i < idx ? 'done' : i === idx ? 'now' : ''}"></span>`).join('');
  h(`
    ${topNav(true)}
    <div class="view rest-view">
      <div class="auth-image"><img src="mykeros-figure-cutout.png" alt=""></div>
      <div class="progress-row"><div class="progress-dots">${dots}</div></div>
      <div class="step-title">Associations</div>
      <div class="kw-history">
        ${history.map(k => `<div class="kw-row"><span class="k">${escapeHtml(k.texte)}</span><span class="a">${escapeHtml(k.association)}</span></div>`).join('')}
      </div>
      <div class="step-card" style="margin-top:auto;">
        <div class="k-label">Mot-clé ${idx + 1} sur ${total}</div>
        <div class="k-word">${escapeHtml(current.texte)}</div>
        <div class="a-label">Ça vous fait penser à quoi ?</div>
        <textarea class="kw-input" id="kw-answer" maxlength="120" placeholder="Ce qui vient, sans réfléchir…"></textarea>
        <div class="kw-meta"><span>120 caractères max</span><span id="kw-count">0 / 120</span></div>
        <button class="kw-next" id="kw-next" disabled>${idx === total - 1 ? 'Continuer →' : 'Mot-clé suivant →'}</button>
      </div>
    </div>
  `);
  bindTopNav();
  const ta = $('#kw-answer');
  const counter = $('#kw-count');
  const next = $('#kw-next');
  ta.oninput = () => {
    counter.textContent = `${ta.value.length} / 120`;
    next.disabled = !ta.value.trim();
  };
  next.onclick = async () => {
    current.association = ta.value.trim();
    next.disabled = true;
    if (idx < total - 1) {
      state.kwIndex++;
      renderAssociations();
    } else {
      // persist keywords + associations
      try {
        for (let i = 0; i < state.keywords.length; i++) {
          const kw = state.keywords[i];
          const { data: kwRow, error: kwErr } = await sb.from('mots_cles').insert({
            reve_id: state.reve.id, texte: kw.texte, categorie: kw.categorie, ordre: i,
          }).select().single();
          if (kwErr) throw kwErr;
          const { error: assocErr } = await sb.from('associations').insert({
            mot_cle_id: kwRow.id, texte: kw.association,
          });
          if (assocErr) throw assocErr;
        }
      } catch (err) {
        alert('Erreur en enregistrant les associations : ' + (err.message || err));
      }
      state.view = 'contexte';
      render();
    }
  };
}

  state.view = 'journal-loading';
  render();
  const { data, error } = await sb.from('reves').select('*').eq('user_id', state.session.user.id).order('numero', { ascending: false });
  state.journal = error ? [] : data;
  state.view = 'journal';
  render();
}

function renderJournalLoading() {
  h(`${topNav(false)}<div class="view rest-view"><div class="auth-image"><img src="mykeros-figure-cutout.png" alt=""></div><div class="loading-block"><div class="spinner"></div></div></div>`);
  bindTopNav();
}

function renderJournal() {
  h(`
    ${topNav(false)}
    <div class="view rest-view">
      <div class="auth-image"><img src="mykeros-figure-cutout.png" alt=""></div>
      <div class="journal-title display">Journal</div>
      ${state.journal.length === 0 ? `<div class="journal-empty">Aucun rêve consigné pour l'instant.</div>` : `
        <div class="journal-list">
          ${state.journal.map(r => `
            <button class="journal-row" data-id="${r.id}">
              <span class="num">#${r.numero}</span>
              <span class="meta">
                <div class="name">${escapeHtml(r.nom || 'Sans titre')}</div>
                <div class="date">${fmtDate(r.date)}${r.sentiment ? ' · ' + escapeHtml(r.sentiment) : ''}</div>
              </span>
            </button>
          `).join('')}
        </div>
      `}
      <div class="footer-actions">
        <button class="btn btn-primary btn-block" id="journal-new">Raconter un nouveau rêve</button>
      </div>
      <div class="legal-links"><a id="go-compte">Mon compte</a><a data-legal="confidentialite">Confidentialité</a></div>
    </div>
  `);
  bindTopNav();
  bindLegalLinks('journal');
  $('#go-compte').onclick = () => { state.view = 'compte'; render(); };
  $('#journal-new').onclick = () => { state.view = 'recueil'; state.recit = ''; state.reve = null; render(); };
  root.querySelectorAll('.journal-row').forEach(btn => {
    btn.onclick = () => {
      const reve = state.journal.find(r => r.id === btn.dataset.id);
      state.reve = reve;
      state.view = 'restitution';
      render();
    };
  });
}

// ---------- COMPTE ----------
function renderCompte() {
  const u = state.session?.user || {};
  const genre = u.user_metadata?.genre || '';
  h(`
    ${topNav(true)}
    <div class="view rest-view">
      <div class="auth-image"><img src="mykeros-figure-cutout.png" alt=""></div>
      <div class="journal-title display">Mon compte</div>
      <div id="acc-msg"></div>
      <div class="account-section">
        <div class="row"><span class="mail">${escapeHtml(u.email || '')}</span></div>
        <div class="field"><label>Genre <span style="opacity:.6">(optionnel)</span></label>
          <select id="acc-genre"><option value="">Je préfère ne pas dire</option><option value="femme"${genre === 'femme' ? ' selected' : ''}>Femme</option><option value="homme"${genre === 'homme' ? ' selected' : ''}>Homme</option><option value="autre"${genre === 'autre' ? ' selected' : ''}>Autre</option></select>
        </div>
        <button class="btn btn-ghost btn-block" id="acc-export">Exporter mes données</button>
        <div style="text-align:center"><button class="danger-link" id="acc-delete">Supprimer mon compte</button></div>
      </div>
      ${legalLinksHtml()}
    </div>
  `);
  bindTopNav();
  bindLegalLinks('compte');
  const msg = (cls, t) => { $('#acc-msg').innerHTML = `<div class="msg ${cls}" style="margin-bottom:6px">${escapeHtml(t)}</div>`; };
  $('#acc-genre').onchange = async (e) => {
    const { error } = await sb.auth.updateUser({ data: { genre: e.target.value } });
    if (error) msg('error', error.message); else msg('ok', 'Genre enregistré.');
  };
  $('#acc-export').onclick = async () => {
    const { data, error } = await sb.from('reves').select('*, mots_cles(*, associations(*))').eq('user_id', u.id).order('numero');
    if (error) return msg('error', error.message);
    const blob = new Blob([JSON.stringify({ exporte_le: new Date().toISOString(), email: u.email, reves: data }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'mykeros-mes-donnees.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $('#acc-delete').onclick = async () => {
    const t = prompt('Cette action est définitive : compte, rêves, lectures, tout sera effacé.\nTapez SUPPRIMER pour confirmer.');
    if (t !== 'SUPPRIMER') return;
    const { error } = await sb.functions.invoke('delete-account', { body: {} });
    if (error) return msg('error', 'Suppression impossible : ' + (error.message || error));
    await sb.auth.signOut();
    state.authMode = 'signin'; state.authDraft = {};
  };
}

// ---------- PAGES LÉGALES ----------
const CONTACT_PARTS = ['privacy', 'mykeros.com']; // assemblée à l'affichage (anti-robots)
const contactHtml = () => `<a data-mail>[adresse e-mail]</a>`;
function fillContact() {
  const addr = CONTACT_PARTS[0] + '@' + CONTACT_PARTS[1];
  root.querySelectorAll('[data-mail]').forEach(a => { a.textContent = addr; a.href = 'mailto:' + addr; });
}
const LEGAL = {
  confidentialite: { titre: 'Confidentialité', html: () => `
    <p>mykeros est un projet en phase de test. Voici, simplement, ce qu'il fait de vos données.</p>
    <h3>Ce que nous conservons</h3>
    <ul><li>Votre adresse e-mail, votre prénom et, si vous le souhaitez, votre genre.</li><li>Vos rêves : récit, émotion, titre, mots-clés, associations, contexte et lecture générée.</li></ul>
    <p>Un rêve peut révéler des informations sensibles (santé, vie intime, convictions). En créant votre compte, vous consentez expressément à ce que ces contenus soient traités pour produire vos lectures.</p>
    <h3>Pourquoi, et avec qui</h3>
    <ul><li>Uniquement pour faire fonctionner votre journal et générer vos lectures. Aucune publicité, aucune revente.</li><li>Les données sont hébergées par Supabase. Pour générer une lecture, le contenu du rêve est transmis à Anthropic (États-Unis), qui fournit l'IA.</li><li>La dictée vocale est assurée par le service de reconnaissance vocale de votre navigateur ou appareil.</li></ul>
    <h3>Vos droits</h3>
    <p>Vous pouvez à tout moment exporter vos données et supprimer vos rêves ou votre compte depuis « Mon compte » : la suppression est immédiate et définitive. Pour toute autre demande (accès, rectification, opposition) : ${contactHtml()}. Vous pouvez aussi saisir la CNIL (cnil.fr).</p>
    <h3>Cookies</h3>
    <p>Aucun cookie publicitaire ni mesure d'audience. Seule votre session de connexion est conservée.</p>
    <p class="stamp">Version de test, mise à jour le 7 octobre 2026.</p>` },
  cgu: { titre: 'Conditions d\'utilisation', html: () => `
    <p>mykeros est un journal de rêves accompagné d'une lecture par intelligence artificielle, en phase de test et gratuit.</p>
    <h3>Ce que mykeros n'est pas</h3>
    <p>Ce n'est ni un dispositif médical ni une thérapie. Les lectures sont des pistes de réflexion, jamais un diagnostic ni un conseil médical ou psychologique. Elles peuvent comporter des erreurs. En cas de détresse, contactez un professionnel de santé ou les urgences (en France : 3114 pour la prévention du suicide, 15 ou 112 en urgence).</p>
    <h3>Votre compte et vos contenus</h3>
    <p>Le service est réservé aux personnes de 15 ans ou plus. Vous gardez la propriété de vos récits ; vous nous autorisez seulement à les traiter pour vous fournir le service. Vous pouvez supprimer votre compte à tout moment.</p>
    <h3>Disponibilité</h3>
    <p>Le service est fourni en l'état, sans garantie de disponibilité, et peut évoluer ou s'arrêter pendant la phase de test. Une offre payante pourra être proposée plus tard ; ses conditions vous seront présentées avant toute souscription.</p>
    <h3>Droit applicable</h3>
    <p>Droit français.</p>
    <p class="stamp">Version de test, mise à jour le 7 octobre 2026.</p>` },
};

function renderLegal() {
  const doc = LEGAL[state.legalDoc] || LEGAL.confidentialite;
  const loggedIn = !!state.session;
  h(`
    ${topNav(false, false)}
    <div class="view rest-view">
      <div class="auth-image"><img src="mykeros-figure-cutout.png" alt=""></div>
      <div class="journal-title display">${escapeHtml(doc.titre)}</div>
      <div class="legal-body">${doc.html()}</div>
      <div class="footer-actions"><button class="btn btn-ghost btn-block" id="legal-back">Retour</button></div>
    </div>
  `);
  bindTopNav();
  fillContact();
  $('#legal-back').onclick = () => { state.view = state.legalBack || (loggedIn ? 'journal' : 'auth'); render(); };
}

// ---------- RENDER DISPATCH ----------
function render() {
  switch (state.view) {
    case 'auth': return renderAuth();
    case 'reset': return renderReset();
    case 'compte': return renderCompte();
    case 'legal': return renderLegal();
    case 'recueil': return renderRecueil();
    case 'sentiment': return renderSentiment();
    case 'nom': return renderNom();
    case 'extracting': return renderExtracting();
    case 'extract-error': return renderExtractError();
    case 'associations': return renderAssociations();
    case 'contexte': return renderContexte();
    case 'restituting': return renderRestituting();
    case 'restitution-error': return renderRestitutionError();
    case 'restitution': return renderRestitution(state.reve);
    case 'journal-loading': return renderJournalLoading();
    case 'journal': return renderJournal();
    default: h(`<div class="view center">${GLYPH(28)}</div>`);
  }
}

document.getElementById('footer-glyph').innerHTML = GLYPH(26);
init();
</script>
</body>
</html>
